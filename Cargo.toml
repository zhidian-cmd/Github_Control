[package]
name = "github-control"
version = "0.1.0"
description = "Github Control - 本地 Git 与 GitHub 桌面控制台（Rust/Tauri 移植版）"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 未直接使用。tauri-build 开启 schemars/preserve_order 后，schemars 0.8.22 以
# IndexMap<K, V> 两参形式使用 indexmap 1.9.3；该版本仅在 std 分支为 S 提供默认
# 泛型，而其 build.rs 默认靠 autocfg 探测 sysroot（新 rustc 下探测失败会走
# no_std 分支导致 E0107）。显式开启 std 强制 has_std，绕过探测。
indexmap = { version = "1.9", features = ["std"] }

[dependencies]
tauri = { version = "2", features = ["image-ico", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "process", "io-util"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
regex = "1"
url = "2"
chrono = "0.4"
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
] }
# 关闭 WebView2 通用自动填充用（版本需与 tauri 内部一致，Cargo.lock 已锁 0.39.1/0.62.2）
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

# 仅 examples/wv2bench.rs（启动性能诊断）使用，版本与 Cargo.lock 中
# tauri 2.12 内部依赖的 tao 0.37.1 / wry 0.57.0 一致，不会引入新版本
[dev-dependencies]
tao = "0.37"
wry = "0.57"
